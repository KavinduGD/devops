name: Build Workflow

on:
    push:
        branches:
            - main

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Maven build
              run: mvn install

    Test:
        runs-on: ubuntu-latest
        needs: Build
        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Run testst on main branch
              run: mvn test

            - name: Checkstyle
              run: mvn checkstyle:checkstyle
